AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple Local Lambda API

Globals:
  Function:
    Timeout: 20
  Api:
    Cors:
      AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 20
      Handler: hello.handler
      Runtime: nodejs18.x
      Events:
        HelloApi:
          Type: Api
          Properties:
            Path: /hello
            Method: get

  ExpensesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Expenses
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  GetExpensesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 20
      Handler: get_expenses.handler
      Runtime: nodejs18.x
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExpensesTable
      Environment:
        Variables:
          TABLE_NAME: !Ref ExpensesTable
      Events:
        GetExpensesApi:
          Type: Api
          Properties:
            Path: /expenses
            Method: get

  CreateExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 20
      Handler: create_expense.handler
      Runtime: nodejs18.x
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExpensesTable
      Environment:
        Variables:
          TABLE_NAME: !Ref ExpensesTable
      Events:
        CreateExpenseApi:
          Type: Api
          Properties:
            Path: /expenses
            Method: post

  DeleteExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 20
      Handler: delete_expense.handler
      Runtime: nodejs18.x
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExpensesTable
      Environment:
        Variables:
          TABLE_NAME: !Ref ExpensesTable
      Events:
        DeleteExpenseApi:
          Type: Api
          Properties:
            Path: /expenses/{id}
            Method: delete